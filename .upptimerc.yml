# LMP live status — https://josefilion.github.io/lmp-status
# Monitored every ~5 minutes by GitHub Actions, hosted on GitHub Pages —
# deliberately OFF LMP's own infrastructure, so the status page stays up when
# our servers don't (2026-08-04 rp outage is exactly why this exists).
owner: JoseFilion
repo: lmp-status
user-agent: JoseFilion

# Least privilege: only these secrets are exposed to the workflow. This list is
# AUTHORITATIVE — any new notification provider must be added here or it will be
# silently ignored. (GH_PAT is passed by the workflow itself, not via this list.)
secrets:
  - NOTIFICATION_DISCORD_WEBHOOK_URL
  # Custom alert text so the Discord feed names the SERVICE, never the backend
  # hostname (default messages interpolate $SITE_URL).
  - NOTIFICATIONS_UP_MESSAGE
  - NOTIFICATIONS_DOWN_MESSAGE

# Names are written for DJs, not engineers — this page is public.
# `slug` is PINNED to each site's original auto-generated slug so the display
# name can be reworded without orphaning its history/graphs or breaking the
# labels on already-open incident issues. NEVER change a slug once it's live.
sites:
  - name: Website (iamlmp.com)
    slug: website-iamlmp-com
    url: https://www.iamlmp.com

  # The app's catalog: browsing, search, genres, artists. Unauthenticated probe,
  # so a healthy API answers 401 (the auth gate working); 200 accepted too in
  # case the route is ever made public.
  - name: Record Pool — Browse & Search
    slug: record-pool-api
    url: https://api.iamlmp.com/wp-json/record-pool/v1/folders
    expectedStatusCodes:
      - 200
      - 401

  # The host that serves the actual mp3 bytes — downloads AND in-app previews.
  # ANY http answer means the web server is alive; its real failure mode is a
  # connection timeout (the 2026-08-04 hardware outage). 5xx still counts down.
  - name: Record Pool — Downloads & Playback
    slug: downloads-and-streaming-rp
    url: https://rp.iamlmp.com
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 400
      - 401
      - 403
      - 404

status-website:
  # ABSOLUTE, on the site's OWN domain. Two traps here:
  #  - pointing at the old josefilion.github.io/lmp-status/ now 301s to http://,
  #    an https->http downgrade browsers refuse for a stylesheet (page renders
  #    completely unstyled);
  #  - root-relative (/lmp-theme.css) is NOT valid here — Upptime treats it as a
  #    route, exports lmp-icon.png as a DIRECTORY, and the build dies on EISDIR.
  logoUrl: https://status.iamlmp.com/lmp-logo.svg
  themeUrl: https://status.iamlmp.com/lmp-theme.css
  # Browser-tab icon: the real LMP app icon (copied from the desktop app's
  # resources/), replacing Upptime's default mark.
  favicon: https://status.iamlmp.com/lmp-icon.png
  faviconSvg: https://status.iamlmp.com/lmp-icon.svg
  # No custom domain yet -> served under /lmp-status on github.io. If we later
  # Served at status.iamlmp.com (DNS: CNAME status -> josefilion.github.io).
  # GitHub Pages needs this `cname` to answer on the custom domain — the old
  # `baseUrl: /lmp-status` sub-path form is what github.io serves without one.
  cname: status.iamlmp.com
  name: LMP Status
  introTitle: "**LMP Record Pool** — live service status"
  introMessage: Website, Record Pool API, and the download/streaming server — checked every ~5 minutes from infrastructure independent of ours.
  navbar:
    - title: Status
      href: /
    - title: IAMLMP.COM
      href: https://www.iamlmp.com
    - title: Discord
      href: https://discord.gg/iamlmp

# Upptime also supports notifications (e.g. Discord webhook alerts on outages),
# assigning issues, and more: https://upptime.js.org/docs/configuration
